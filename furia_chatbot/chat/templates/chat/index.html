{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURIA Chatbot</title>
    <link rel="stylesheet" href="furia_chatbot\furia_chatbot\chat\static\chat\style.css">
</head>
<body>
    <div class="iphone-frame">
        <div class="chat-header">
            <img src="furia_chatbot\chat\static\chat\profile.png" alt="Avatar" class="avatar">
            <div class="contact-info">
                <div class="name">FURIA Bot</div>
                <div class="status">Online</div>
            </div>
        </div>
        <div class="chat-box" id="chat-box">
            <!-- Mensagens serão inseridas aqui via JS -->
        </div>
        <div class="user-input">
            <input type="text" id="user-input" placeholder="Mensagem...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        function getCSRFToken() {
            return '{{ csrf_token }}';
        }

        function appendMessage(content, type) {
            const message = document.createElement("div");
            message.classList.add("bubble", type);
            message.innerHTML = `
                <div class="text">${content}</div>
                <div class="status">Visto</div>
            `;
            document.getElementById("chat-box").appendChild(message);
            message.scrollIntoView();
        }

        function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            appendMessage(message, "sent");
            input.value = "";

            fetch("/responder/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCSRFToken()
                },
                body: JSON.stringify({ mensagem: message })
            })
            .then(response => response.json())
            .then(data => {
                appendMessage(data.resposta, "received");
            })
            .catch(error => {
                console.error("Erro:", error);
                appendMessage("Erro ao tentar responder.", "received");
            });
        }
    </script>
</body>
</html>
